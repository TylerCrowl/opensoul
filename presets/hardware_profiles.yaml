# Voice engines the picker lists under the Voice card. `app_default` must match presets/models.yaml (voice
# default_backend): the Speak tab, older stories and the no-clip fallback use it. The `new_stories_default` option
# must match presets/voice_engine.json tts_default_new. `recommended` is the picker's pick.
voice_options:
  app_default: orpheus
  recommended: chatterbox
  options:
    - model: chatterbox
      status: recommended
      note: "MIT license. Pick it per story; each character speaks in their own voice clip (consent required), else one shared voice. Workflows 03b / 03b_ref."
    - model: orpheus
      status: app_default
      note: "Named voices (Lumi Tara, Mio Leah, Ren Zac, Pixel Jess) and emotion tags like <sigh>. Older stories keep it unchanged; a character with no voice clip speaks with it; rollback for new stories: OPENSOUL_TTS_DEFAULT=orpheus."
    - model: kokoro
      status: in_app
      note: "Small and fast; reads the words without the emotion tags (OPENSOUL_TTS=kokoro)."
    - model: voxcpm2
      status: new_stories_default
      note: "Apache-2.0. The default for new stories: each character speaks in their own voice clip (consent required); without a clip the line uses Orpheus, with a note. Own venv: scripts/setup_tts_voxcpm2.sh."

# Named so the picker can say why they are not offered. Never recommended.
not_recommended:
  demucs:
    label: Demucs (vocal separation)
    stage: music
    registry: {file: presets/music_models.json, model: demucs}
    license: research-only (weights)
    license_verified: false
    license_source: "presets/music_models.json (status: blocked)"
    reason: "Blocked: the pretrained weights are for research and personal use only."
  arcface:
    label: InsightFace buffalo_l
    stage: identity
    registry: {file: presets/models.yaml, stage: identity_gate, backend: arcface}
    license: non-commercial (weights)
    license_verified: false
    license_source: "presets/models.yaml (license: non-commercial (weights))"
    reason: "Blocked: non-commercial weights."

# Tiers are matched top to bottom; the first match wins. `match` keys:
#   gpu_class: spark | discrete | none;  min_memory_gb (unified memory) / min_vram_gb, max_vram_gb (discrete);
#   min_machines / max_machines (from OPENSOUL_MACHINES or the saved setting, never the network).
tiers:
  - id: spark_x1
    label: "1 × DGX Spark (128 GB unified memory)"
    short: "1 × Spark"
    tested: true
    status: tested
    status_label: "tested (measured on Spark)"
    match: {gpu_class: spark, min_memory_gb: 100, max_machines: 1}
    summary: "The full-quality stack OpenSoul was built and measured on. One stage runs at a time; the video model is the biggest at about 68-71 GB."
    machines:
      - {id: a, label: "Spark", stages: [stills, video, lipsync, tts, music]}
    picks:
      - stage: stills
        model: qwen_edit_bf16
        machine: a
        tested: true
        memory: {measured_gb: 28.8, detail: "28.7 GiB GPU process, 28.8 GB drop in available memory (one clean run, Oct 17 2026)", source: docs/HARDWARE_MEMORY.md}
        why: "Full-precision picture editing keeps the character's face the same from shot to shot."
      - stage: video
        model: ltx25_bf16
        machine: a
        tested: true
        memory: {measured_gb: 70.7, detail: "68.0 GiB GPU process, 70.7 GB drop in available memory, 1024×1792, 97 frames (one clean run, Oct 17 2026)", source: docs/HARDWARE_MEMORY.md}
        why: "Full-precision video at full size. This is the stage that sets the hardware bar."
      - stage: lipsync
        model: ltx_av
        machine: a
        tested: true
        memory: {measured_gb: 70.7, detail: "Same run as the video: the voice goes into the video model (1024×1792, 97 frames, Oct 17 2026)", source: docs/HARDWARE_MEMORY.md}
        why: "The mouth is made together with the picture from the voice, with the camera held still."
        stage2:
          model: latentsync
          tested: true
          memory: {measured_gb: 21.6, measured_low_gb: 17.0, detail: "17.0 GiB GPU process, 21.6 GB drop in available memory, same 97-frame take, run after the video model was unloaded (one clean run, Oct 17 2026)", source: docs/HARDWARE_MEMORY.md}
          why: "Optional, off by default: 'Mouth refine (LatentSync), may pale lips' re-draws the mouth after a camera-locked take when LatentSync is installed and the face is clear. It can pale the lips."
      - stage: tts
        model: chatterbox
        machine: a
        tested: false
        memory: {est_gb: 6, source: estimate, basis: "3.2 GB of weights (Hugging Face file sizes) plus working memory; not measured on the Spark"}
        why: "Expressive voices under the MIT license. Small next to the video model."
      - stage: music
        model: ace_step
        machine: a
        tested: false
        memory: {est_gb: 24, source: estimate, basis: "19.9 GB of weights plus working memory; presets/music_models.json lists 24 GB with no offload. Not run on the GPU from the app yet"}
        why: "Full songs with vocals from your own lyrics, MIT license."

  - id: spark_x2
    label: "2 × DGX Spark"
    short: "2 × Spark"
    tested: false
    status: planned
    status_label: "planned"
    planned_reason: "Planned: the app talks to one ComfyUI address today, so it can't send stages to a second computer yet."
    match: {gpu_class: spark, min_memory_gb: 100, min_machines: 2}
    summary: "Video on one Spark; pictures, voices and music on the other, so they can run while a video renders. Not tried on two machines yet."
    note: "The app sends work to one ComfyUI address today (COMFY_BASE_URL). Splitting stages means starting ComfyUI on both machines and pointing each stage's runs at its machine yourself; OpenSoul never looks for the second machine on the network. A third or later machine is not used."
    machines:
      - {id: a, label: "Spark A (video)", stages: [video, lipsync]}
      - {id: b, label: "Spark B (pictures and sound)", stages: [stills, tts, music]}
    picks:
      - stage: video
        model: ltx25_bf16
        machine: a
        tested: false
        memory: {est_gb: 71, source: estimate, basis: "taken from the single-Spark measurement (docs/HARDWARE_MEMORY.md); not measured in a two-machine setup"}
        why: "The video model gets a whole Spark to itself."
      - stage: lipsync
        model: ltx_av
        machine: a
        tested: false
        memory: {est_gb: 71, source: estimate, basis: "same pass as the video model"}
        why: "The mouth is made inside the video run, so it stays on the video machine."
        stage2:
          model: latentsync
          tested: false
          memory: {est_gb: 22, source: estimate, basis: "taken from the single-Spark measurement (17.0 GiB GPU process, 21.6 GB); not measured in a two-machine setup"}
          why: "Optional, off by default (may pale lips). Runs after the video on the same machine."
      - stage: stills
        model: qwen_edit_bf16
        machine: b
        tested: false
        memory: {est_gb: 29, source: estimate, basis: "taken from the single-Spark measurement; not measured in a two-machine setup"}
        why: "Pictures for the next shot can be made while the other Spark renders video."
      - stage: tts
        model: chatterbox
        machine: b
        tested: false
        memory: {est_gb: 6, source: estimate, basis: "3.2 GB of weights plus working memory"}
        why: "Voices sit next to the pictures and never wait for a video."
      - stage: music
        model: ace_step
        machine: b
        tested: false
        memory: {est_gb: 24, source: estimate, basis: "19.9 GB of weights; presets/music_models.json lists 24 GB"}
        why: "Songs render on the second machine without slowing the video."

  - id: rtx_32gb
    label: "RTX 5090 or another 32 GB NVIDIA card"
    short: "32 GB card"
    tested: false
    status: untested
    status_label: "untested (estimate)"
    match: {gpu_class: discrete, min_vram_gb: 30}
    summary: "Compressed video model plus low-memory mode. Expect slower renders than the Spark and, for long shots, a smaller size or fewer frames."
    launch_flags: "Start ComfyUI with --lowvram for video. Plan on 64 GB or more of system memory for the parts that move off the card (estimate)."
    machines:
      - {id: a, label: "This computer", stages: [stills, video, lipsync, tts, music]}
    picks:
      - stage: stills
        model: qwen_edit_fp8mixed
        machine: a
        tested: false
        memory: {est_gb: 24, source: estimate, basis: "20.5 GB picture model on the card; the 9.4 GB text encoder is moved off the card after it runs"}
        why: "The fp8 picture model fits on the card; the full bf16 file (40.9 GB) does not."
      - stage: video
        model: ltx25_int8
        machine: a
        tested: false
        memory: {est_gb: 30, source: estimate, basis: "21.5 GB int8 video model resident with --lowvram; the 15.4 GB text encoder is offloaded after encoding; the rest is working memory for the frames"}
        why: "The compressed video model is about half the size of bf16 (21.5 GB vs 42.0 GB)."
      - stage: lipsync
        model: ltx_av
        machine: a
        tested: false
        memory: {est_gb: 30, source: estimate, basis: "same pass as the video model"}
        why: "The mouth is made in the same video run, with the camera held still."
        stage2:
          model: latentsync
          tested: false
          memory: {est_gb: 22, source: estimate, basis: "the Spark measurement (17.0 GiB GPU process) plus headroom; not run on a 32 GB card"}
          why: "Optional, off by default (may pale lips). Fits on the card once the video model is unloaded."
      - stage: tts
        model: chatterbox
        machine: a
        tested: false
        memory: {est_gb: 6, source: estimate, basis: "3.2 GB of weights plus working memory"}
        why: "Expressive voices that fit easily next to everything else."
      - stage: music
        model: ace_step
        machine: a
        tested: false
        memory: {est_gb: 24, source: estimate, basis: "19.9 GB of weights; presets/music_models.json lists 24 GB"}
        why: "Fits on a 32 GB card when nothing else is loaded."

  - id: rtx_24gb
