# OpenSoul hardware-to-model picker (opensoul/hardware.py, docs/HARDWARE_MEMORY.md "Hardware picker").
#
# Honesty rules (tests/test_hardware_profiles.py enforces them):
# - Only one tier is tested: one DGX Spark (GB10, 128 GB unified memory). Every other tier is "untested (estimate)".
# - A memory number is either `measured_gb` (measured on the Spark, source docs/HARDWARE_MEMORY.md) or `est_gb`
#   (source: estimate, with the basis written next to it). An untested tier never carries `measured_gb`.
# - Model ids are the backend ids in presets/models.yaml (and the model id in presets/music_models.json for music).
# - Licences come in three allowed classes (license_classes): open (license_allowlist), LTX-2.x with the
#   AI-generated label, and open weights with use restrictions (OpenRAIL++-M, Llama Community Licence), shown with
#   their own amber badge. Anything else is never recommended. Licence tags and file sizes were read from the Hugging Face Hub (read-only) on 2026-10-22 and
#   are cited as hf:<repo>@<revision>. `weights_gb` is the download size of the files, not a memory measurement.
# - Detection is local and read-only: nvidia-smi / torch.cuda (with timeouts) and /proc/meminfo. The machine count
#   is never discovered over the network; it comes from OPENSOUL_MACHINES or the saved setting (default 1).
schema: 1
checked: "2026-10-22"

license_allowlist: [Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, CC0-1.0, CC-BY-4.0]
license_rules:
  needs_credit: [CC-BY-4.0]
  needs_ai_label: [LTX-2.x Community License]
  blocked_patterns: ['\bNC\b', 'non-?commercial', 'research', 'gated', 'no[- ]redistribution', 'unlicensed', 'proprietary']
# How the picker labels each allowed licence. `use_restricted.licenses` is the allowlist tier for open weights whose
# licence allows commercial use but lists uses that are not allowed (an acceptable-use policy).
license_classes:
  open: {label: "Open license", explain: "Free to use, change and share, including commercially."}
  ai_label: {label: "Open weights, AI-generated label", explain: "Free under $10M yearly revenue; every video carries the AI-generated label."}
  use_restricted:
    label: "Open weights, use-restricted"
    explain: "Commercial use allowed; some uses prohibited."
    licenses: [OpenRAIL++-M, Llama 3.2 Community License]

stages:
  - {id: stills, label: Pictures, plain: "Character sheets and scene pictures"}
  - {id: video, label: Video, plain: "Moving shots made from your pictures"}
  - {id: lipsync, label: Lip-sync, plain: "Mouth moves in time with the voice"}
  - {id: tts, label: Voice, plain: "Spoken lines from your script"}
  - {id: music, label: Music, plain: "Songs and backing music"}

