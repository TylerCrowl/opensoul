mac_caveats:
  - "ComfyUI on Apple's MPS backend has an open bug: bf16 LTX-2.x runs can come out all black (ComfyUI issue 15804, https://github.com/Comfy-Org/ComfyUI/issues/15804). Route Mac video through MLX instead."
  - "MLX routes exist: comfyui-ltx2-mlx nodes (LTX-2.3), dgrauet/ltx-2.5-mlx-q4 and -q8 weights, and mflux for Z-Image-Turbo, FLUX.2 klein and Qwen-Image-Edit."
  - "Qwen-Image-Edit is heavy on a Mac (a q8 build is reported at 96 GB+); smaller Macs should edit with FLUX.2 klein 4B."
  - "LatentSync, the Wan 14B models and other CUDA-only nodes are hidden on a Mac rather than offered and failing."
  - "No Mac speed has been measured by us, and OpenSoul's runners are Linux + NVIDIA only today: every Mac row is a recommendation, not a supported setup."

