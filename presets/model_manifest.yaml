# OpenSoul model manifest: one swappable model slot per pipeline step (opensoul/model_manifest.py, docs/SETUP.md).
#
# One source of truth for "which model fills which step, under what licence, with how much memory and disk":
# - Models the app runs today (`in_app: true`) are NOT copied here. Their label, licence, licence source, download
#   size and URL are read from presets/hardware_profiles.yaml (`models.<id>`), their files from presets/models.yaml,
#   and their memory per tier from the hardware_profiles.yaml picks. This file only adds the slot, how to install it
#   and which machines it runs on, so the existing registries keep working unchanged.
# - Candidates the app does not run yet (`in_app: false`) carry their own facts. Licence tags and file sizes were read
#   from the Hugging Face Hub API (read-only) on 2026-10-23 and are cited as hf:<repo>@<revision>. Their memory
#   numbers are estimates or figures reported by the tool's authors, never measurements.
# - Slot defaults are the app's defaults (tests/test_model_manifest.py checks them against presets/models.yaml,
#   presets/voice_engine.json and presets/music_models.json). This file never changes a default.
# - Licence classes are the picker's (presets/hardware_profiles.yaml license_classes). `commercial_use` is derived:
#   open -> yes; ai_label / use_restricted -> conditional; anything else -> no (never offered).
schema: 1
checked: "2026-10-23"

slots:
  - id: image
    label: Pictures from text
    plain: "Text-only character masters and scene pictures"
    app_stage: master            # presets/models.yaml stage
    picker_stage: stills         # presets/hardware_profiles.yaml stage
    default: zimage
  - id: edit
    label: Picture edit
    plain: "Consistent stills and the six-view character sheet, edited from a reference"
    app_stage: stills
    picker_stage: stills
    default: qwen_edit_fp8mixed  # the sheet stage uses qwen_edit_bf16 (presets/models.yaml stage "sheet")
  - id: video
    label: Video
    plain: "Moving shots made from your pictures"
    app_stage: video
    picker_stage: video
    default: ltx25_int8          # presets/models.yaml default; LTX_VARIANT=bf16 selects ltx25_bf16 (the Spark's pick)
  - id: lipsync
    label: Lip-sync
    plain: "Mouth moves in time with the voice"
    app_stage: lipsync
    picker_stage: lipsync
    default: ltx_av
  - id: music
    label: Music
    plain: "Songs and backing music"
    app_stage: null              # presets/music_models.json defaults.song
    picker_stage: music
    default: ace_step
  - id: voice
    label: Voice
    plain: "Spoken lines from your script"
    app_stage: voice
    picker_stage: tts
    default: voxcpm2             # presets/voice_engine.json tts_default_new (new stories)
    fallback: orpheus            # presets/models.yaml voice default_backend (older stories, Speak tab, no-clip fallback)
  - id: upscale
    label: Upscale
    plain: "Make a finished shot sharper or bigger"
    app_stage: null              # the LTX latent upscaler ships inside the video pack; no separate stage yet
    picker_stage: null
    default: ltx_spatial_upscaler_x2

# install: how OpenSoul fetches it. `download_groups` are scripts/download_models.sh groups; `env` is what the run
# needs set; `setup` is a setup script that makes its own venv. A model with `install: null` is not installable by
# OpenSoul yet (manual, Phase 2).
# platforms: nvidia (Linux + CUDA, through ComfyUI), apple (Apple Silicon), cpu.
models:
  # ---------------------------------------------------------------- in the app today (facts from hardware_profiles.yaml)
  zimage:
    slot: image
    in_app: true
    platforms: [nvidia]
    memory: {est_gb: 16, source: estimate, basis: "12.3 GB bf16 model plus working memory; the 8.0 GB text encoder can be offloaded after encoding. Runs on the Spark but is not broken out in docs/HARDWARE_MEMORY.md"}
    install: {download_groups: [master]}
  qwen_edit_fp8mixed:
    slot: edit
    in_app: true
    platforms: [nvidia]
    install: {download_groups: [stills]}
  qwen_edit_bf16:
    slot: edit
    in_app: true
    platforms: [nvidia]
    install: {download_groups: [stills, sheet]}   # sheet adds the bf16 model; stills has the shared encoder, VAE, LoRA
  ltx25_int8:
    slot: video
    in_app: true
    platforms: [nvidia]
    install: {download_groups: [video], env: {LTX_VARIANT: int8}, gated: true}
  ltx25_bf16:
    slot: video
    in_app: true
    platforms: [nvidia]
    install: {download_groups: [video], env: {LTX_VARIANT: bf16}, gated: true}
  ltx_av:
    slot: lipsync
    in_app: true
    platforms: [nvidia]
    bundled_with: [ltx25_int8, ltx25_bf16]          # no extra files: the video model run with the voice as input
    install: {download_groups: [video], gated: true}
  latentsync:
    slot: lipsync
    in_app: true
    platforms: [nvidia]
    optional: true
    install: {download_groups: [lipsync], manual_steps: ["git clone https://github.com/bytedance/LatentSync into $OPENSOUL_HOME/LatentSync first"]}
  voxcpm2:
    slot: voice
    in_app: true
    memory: {est_gb: 8, source: estimate, basis: "4.6 GB model + 0.38 GB audio VAE (2.29B parameters) plus working memory; not broken out in docs/HARDWARE_MEMORY.md"}
    platforms: [nvidia]
    install: {setup: scripts/setup_tts_voxcpm2.sh}
  orpheus:
    slot: voice
    in_app: true
    memory: {est_gb: 4, source: estimate, basis: "2.4 GB Q4_K_M GGUF under llama.cpp plus the small SNAC decoder; not broken out in docs/HARDWARE_MEMORY.md"}
    platforms: [nvidia, cpu]
    install: {download_groups: [orpheus], setup: scripts/setup_tts_orpheus.sh}
  chatterbox:
    slot: voice
    in_app: true
    platforms: [nvidia]
    install: {download_groups: [tts], env: {ALLOW_PICKLE: "1"}}
  kokoro:
    slot: voice
    in_app: true
    platforms: [nvidia, cpu]
    install: {download_groups: [tts], env: {ALLOW_PICKLE: "1"}}
  ace_step:
    slot: music
    in_app: true
    platforms: [nvidia]
    install: {download_groups: [music]}
  ltx_spatial_upscaler_x2:
    slot: upscale
    in_app: true
    platforms: [nvidia]
    bundled_with: [ltx25_int8, ltx25_bf16]
    own:                                           # not a picker model, so its facts live here
      label: LTX-2.5 latent spatial upscaler x2
      license: LTX-2.x Community License
      ai_label: true
      license_verified: true
      license_source: "hf:Lightricks/LTX-2.5@49b093a39c19169a8a81721dcc541e07e945232f (license: other, license_name: ltx-2.x-community-license-agreement)"
      url: https://huggingface.co/Lightricks/LTX-2.5
      weights_gb: 1.0
      weights_source: "part of the video pack (presets/hardware_profiles.yaml ltx25_bf16 weights_source: spatial upscaler x2 1.0 GB)"
      memory: {est_gb: null, source: estimate, basis: "runs inside the video workflow's second stage; not broken out"}
      file: latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors
    install: {download_groups: [video], gated: true}

  # ---------------------------------------------------------------- candidates, not in the app yet (own facts)
  flux2_klein_4b:
    slot: image
    also_slots: [edit]
    in_app: false
    in_app_note: "Generate + edit in one 4B model. No OpenSoul workflow yet."
