# Recommendation-only tiers for machines the app's picker has no tested or estimated stack for (its "fallback").
# They never change what the app runs: they say which slot models to try, all as estimates or author-reported
# figures, and are shown in place of "no recommendation". Matched top to bottom; first match wins.
#   match: platform: nvidia | apple | cpu;  min_vram_gb / max_vram_gb (NVIDIA, discrete);  min_memory_gb / max_memory_gb (Apple unified).
advisory_tiers:
  - id: nvidia_16gb
    label: "16 GB NVIDIA card (RTX 4080, 5080 and similar)"
    match: {platform: nvidia, min_vram_gb: 14, max_vram_gb: 22}
    status_label: "recommendation only (estimate)"
    verdict: "Usable studio for 720p shorts once GGUF workflows land. Not tested by us."
    picks:
      image: {model: zimage, note: "bf16 fits; the 8 GB text encoder is offloaded after it runs"}
      edit: {model: qwen_edit_gguf_q4, note: "GGUF Q4-Q5"}
      video: {model: ltx25_gguf_q4, note: "distilled Q4_K_M with offload"}
      lipsync: {model: ltx_av_gguf_q4, note: "a2v on the same GGUF model"}
      music: {model: ace_step_2b_turbo, note: "2B sft/turbo; XL turbo only with offload"}
      voice: {model: voxcpm2, note: "4.6 GB of weights"}
      upscale: {model: null, note: "skip; finish at the render size"}
  - id: nvidia_12gb
    label: "12 GB NVIDIA card (RTX 3060 12 GB, 4070 and similar)"
    match: {platform: nvidia, min_vram_gb: 10, max_vram_gb: 14}
    status_label: "recommendation only (estimate)"
    verdict: "Drafts of everything; finals are slow. Not tested by us."
    picks:
      image: {model: zimage, note: "fp8 / GGUF builds recommended; bf16 needs offload"}
      edit: {model: qwen_edit_gguf_q4, note: "Q4 with offload"}
      video: {model: wan22_ti2v_5b_gguf_q4, note: "Wan2.2 TI2V-5B GGUF Q5-Q8; LTX-2.5 GGUF Q3-Q4 with offload is experimental"}
      lipsync: {model: ltx_av_gguf_q4, note: "experimental"}
      music: {model: ace_step_2b_turbo, note: "2B with the small LM"}
      voice: {model: kokoro, note: "or Chatterbox"}
      upscale: {model: null, note: "skip"}
  - id: nvidia_8gb
    label: "8 GB NVIDIA card (RTX 4060 and similar)"
    match: {platform: nvidia, min_vram_gb: 6, max_vram_gb: 10}
    status_label: "recommendation only (estimate)"
    verdict: "Stills, songs and voice. Video and lip-sync: use a remote GPU. Not tested by us."
    picks:
      image: {model: flux2_klein_4b, note: "or Z-Image-Turbo GGUF Q4"}
      edit: {model: qwen_edit_gguf_q3, note: "Q2-Q3 with offload, slow"}
